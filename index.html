<!DOCTYPE html>
<html class="dark" dir="rtl" lang="fa">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>داشبورد عیدانه | نسخه نئونی پیشرفته</title>
    
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@100;300;400;500;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fb51fb",
                        "primary-glow": "#d946d9",
                        "secondary": "#4f46e5",
                        "background-dark": "#0a0a0c",
                        "surface-dark": "#16161a",
                    },
                    fontFamily: {
                        "display": ["Lalezar", "Vazirmatn", "sans-serif"],
                        "body": ["Vazirmatn", "sans-serif"],
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 3s infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { boxShadow: '0 0 15px 0px rgba(251, 81, 251, 0.2)' },
                            '50%': { boxShadow: '0 0 25px 5px rgba(251, 81, 251, 0.5)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121216; }
        ::-webkit-scrollbar-thumb { background: #fb51fb; border-radius: 4px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: #d946d9; }
        
        body { min-height: max(884px, 100dvh); }
        
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; opacity: 0.05;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        
        .draggable-item.dragging { opacity: 0.4; transform: scale(0.98); }
        .draggable-item.drag-over { border-color: #fb51fb; background-color: rgba(251, 81, 251, 0.1); box-shadow: 0 0 15px rgba(251, 81, 251, 0.3); }
        
        /* انیمیشن چرخش دکمه سورت */
        .sort-icon { transition: transform 0.3s ease; }

        /* استایلهای اولویت */
        .priority-1 { border-color: rgba(239, 68, 68, 0.5) !important; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        .priority-2 { border-color: rgba(251, 81, 251, 0.4) !important; }
        .priority-3 { border-color: rgba(34, 211, 238, 0.4) !important; }
        
        .priority-1-glow { text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); color: #ef4444 !important; }
        .priority-2-glow { text-shadow: 0 0 10px rgba(251, 81, 251, 0.8); color: #fb51fb !important; }
        .priority-3-glow { text-shadow: 0 0 10px rgba(34, 211, 238, 0.8); color: #22d3ee !important; }

        .priority-badge { font-size: 9px; padding: 2px 8px; border-radius: 6px; font-weight: 800; letter-spacing: 0.5px; }
        .badge-1 { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-2 { background: rgba(251, 81, 251, 0.15); color: #fb51fb; border: 1px solid rgba(251, 81, 251, 0.3); }
        .badge-3 { background: rgba(34, 211, 238, 0.15); color: #22d3ee; border: 1px solid rgba(34, 211, 238, 0.3); }
    </style>
</head>
<body class="font-body antialiased bg-background-dark text-white selection:bg-primary selection:text-white overflow-x-hidden">
    
    <div class="noise-overlay"></div>
    
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-[20%] left-1/2 -translate-x-1/2 w-[150%] h-[70%] rounded-[100%] bg-gradient-to-b from-[#1a0f2e] via-[#0f0a1a] to-transparent opacity-60 blur-3xl"></div>
        <div class="absolute top-20 right-0 w-96 h-96 bg-primary/10 rounded-full blur-[100px] mix-blend-screen animate-pulse-glow opacity-60"></div>
        <div class="absolute bottom-40 left-[-100px] w-80 h-80 bg-blue-600/10 rounded-full blur-[90px] mix-blend-screen opacity-50"></div>
    </div>

    <header class="sticky top-0 z-50 bg-surface-dark/60 backdrop-blur-xl w-full h-16 border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
        <div class="flex justify-between items-center max-w-4xl mx-auto px-6 h-16 w-full relative z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-primary/20 border border-primary/40 flex items-center justify-center shadow-[0_0_10px_rgba(251,81,251,0.3)]">
                    <span class="material-symbols-outlined text-primary text-sm">hub</span>
                </div>
                <h1 class="text-2xl font-display text-transparent bg-clip-text bg-gradient-to-l from-white to-white/70 tracking-wide mt-1">پیشخوان <span class="text-primary">عیدانه</span></h1>
            </div>
            
            <div class="hidden md:flex items-center gap-6 border-l border-white/10 pl-6 mr-6 h-10">
                <div class="flex flex-col items-center gap-0.5">
                    <span class="text-[8px] font-bold text-red-400 uppercase tracking-tighter">فوری</span>
                    <span id="prio-1-stats" class="text-[10px] font-display text-white/80">۰/۰</span>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <span class="text-[8px] font-bold text-primary uppercase tracking-tighter">عادی</span>
                    <span id="prio-2-stats" class="text-[10px] font-display text-white/80">۰/۰</span>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <span class="text-[8px] font-bold text-cyan-400 uppercase tracking-tighter">سر فرصت</span>
                    <span id="prio-3-stats" class="text-[10px] font-display text-white/80">۰/۰</span>
                </div>
            </div>

            <div class="hidden sm:flex flex-col items-start gap-1">
                <span class="text-[10px] font-bold text-white/50 tracking-widest uppercase">وضعیت کلی</span>
                <div class="flex items-center gap-3">
                    <span id="progress-text" class="text-xs font-display text-primary drop-shadow-[0_0_5px_rgba(251,81,251,0.5)] w-12 text-right">۰ / ۰</span>
                    <div class="w-32 h-1.5 bg-white/10 rounded-full overflow-hidden shrink-0 flex justify-end shadow-inner border border-white/5">
                        <div id="progress-bar" class="h-full w-[0%] bg-gradient-to-l from-primary via-primary-glow to-purple-500 transition-all duration-500 shadow-[0_0_10px_rgba(251,81,251,0.8)]"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 w-full min-h-screen">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
            
            <div class="sticky top-20 z-40 mb-6">
                <div class="bg-surface-dark/80 backdrop-blur-xl p-2 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)] border border-white/10 flex items-center gap-3 transition-all focus-within:border-primary/60 focus-within:shadow-[0_0_20px_rgba(251,81,251,0.2)]">
                    <div class="w-10 h-10 flex items-center justify-center text-white/30">
                        <span class="material-symbols-outlined">person_add</span>
                    </div>
                    <div class="flex-1 px-2">
                        <input id="name-input" class="w-full border-none outline-none focus:ring-0 bg-transparent text-white placeholder:text-white/30 text-base font-body" placeholder="نام هدف جدید را وارد کنید (سپس اینتر بزنید)..." type="text" autocomplete="off" />
                    </div>
                    <div class="flex items-center gap-1.5 border-r border-white/10 pr-3 mr-1">
                        <button onclick="setAddPriority(1)" id="prio-set-1" title="اولویت بالا (فوری)" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-red-500/20">
                            <span class="material-symbols-outlined text-[18px] text-red-500">error</span>
                        </button>
                        <button onclick="setAddPriority(2)" id="prio-set-2" title="اولویت متوسط (عادی)" class="w-8 h-8 rounded-lg bg-primary/20 border border-primary/50 flex items-center justify-center transition-all shadow-[0_0_10px_rgba(251,81,251,0.3)]">
                            <span class="material-symbols-outlined text-[18px] text-primary">fiber_manual_record</span>
                        </button>
                        <button onclick="setAddPriority(3)" id="prio-set-3" title="اولویت پایین (سر فرصت)" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-cyan-400/20">
                            <span class="material-symbols-outlined text-[20px] text-cyan-400">low_priority</span>
                        </button>
                    </div>
                    <button id="add-btn" class="h-12 w-12 rounded-xl bg-white/5 border border-white/10 text-white flex items-center justify-center hover:bg-primary hover:border-primary hover:shadow-[0_0_15px_rgba(251,81,251,0.5)] transition-all duration-300 group">
                        <span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-300">add</span>
                    </button>
                </div>
            </div>

            <div class="mb-10 relative group">
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/30 group-focus-within:text-primary transition-colors">search</span>
                <input id="search-input" class="w-full bg-surface-dark/40 backdrop-blur-md border border-white/5 rounded-2xl py-3.5 pr-12 pl-4 text-white placeholder:text-white/30 focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/40 focus:bg-surface-dark/80 transition-all shadow-inner" placeholder="جستجو در رادار اهداف..." type="text" autocomplete="off" />
                <button id="clear-search-btn" class="absolute left-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-white/30 hover:text-white hidden transition-all">
                    <span class="material-symbols-outlined text-sm">close</span>
                </button>
            </div>

            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm uppercase tracking-widest text-white/60 font-bold font-display opacity-80">لیست اهداف</h2>
                <div class="h-[1px] bg-gradient-to-r from-white/20 to-transparent flex-1 mx-4 opacity-80 hidden sm:block"></div>
                <div class="flex gap-2 shrink-0">
                    <button id="sort-btn" title="مرتب‌سازی حروف الفبا" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-green-500/20 hover:border-green-500/50 hover:shadow-[0_0_10px_rgba(34,197,94,0.3)] transition-all">
                        <span id="sort-icon" class="material-symbols-outlined text-[18px] sort-icon">sort_by_alpha</span>
                    </button>
                    
                    <button id="sort-priority-btn" title="مرتب‌سازی بر اساس اولویت" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-red-500/20 hover:border-red-500/50 hover:shadow-[0_0_10px_rgba(239,68,68,0.3)] transition-all">
                        <span class="material-symbols-outlined text-[18px]">priority_high</span>
                    </button>

                    <button id="toggle-completed-btn" title="مخفی/نمایش تکمیل شده‌ها" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-yellow-500/20 hover:border-yellow-500/50 hover:shadow-[0_0_10px_rgba(234,179,8,0.3)] transition-all">
                        <span id="toggle-completed-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                    </button>
                    
                    <input type="file" id="import-file" accept=".json" class="hidden" />
                    <button id="import-btn" title="بارگذاری فایل JSON" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-blue-500/20 hover:border-blue-500/50 hover:shadow-[0_0_10px_rgba(59,130,246,0.3)] transition-all">
                        <span class="material-symbols-outlined text-[18px]">upload_file</span>
                    </button>
                    <button id="export-btn" title="دانلود خروجی JSON" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/60 hover:text-white hover:bg-primary/20 hover:border-primary/50 hover:shadow-[0_0_10px_rgba(251,81,251,0.3)] transition-all">
                        <span class="material-symbols-outlined text-[18px]">download</span>
                    </button>
                </div>
            </div>

            <div id="list-container" class="flex flex-col gap-3">
                </div>

        </div>
    </main>

    <script>
        // --- State Management ---
        let greetingsData = JSON.parse(localStorage.getItem('neonNowruzDB')) || [];
        let dragStartId = null;
        let searchQuery = '';
        let sortAscending = true;
        let selectedAddPriority = 2; // پیش‌فرض: متوسط
        let showCompleted = true; // نمایش همه در ابتدا

        const listContainer = document.getElementById('list-container');
        const nameInput = document.getElementById('name-input');
        const addBtn = document.getElementById('add-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        const prioStatsElems = {
            1: document.getElementById('prio-1-stats'),
            2: document.getElementById('prio-2-stats'),
            3: document.getElementById('prio-3-stats')
        };
        
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        const importBtn = document.getElementById('import-btn');
        const importFile = document.getElementById('import-file');
        const exportBtn = document.getElementById('export-btn');
        
        const sortBtn = document.getElementById('sort-btn');
        const sortIcon = document.getElementById('sort-icon');
        const sortPriorityBtn = document.getElementById('sort-priority-btn');
        const toggleCompletedBtn = document.getElementById('toggle-completed-btn');
        const toggleCompletedIcon = document.getElementById('toggle-completed-icon');

        const priorityColors = {
            1: 'text-red-500',
            2: 'text-primary',
            3: 'text-cyan-400'
        };

        // --- Core Functions ---
        function saveData() {
            localStorage.setItem('neonNowruzDB', JSON.stringify(greetingsData));
            updateProgress();
        }

        function addPerson() {
            const name = nameInput.value.trim();
            if (name === '') return;

            const isDuplicate = greetingsData.some(person => person.name.toLowerCase() === name.toLowerCase());
            
            if (isDuplicate) {
                alert(`خطا: هدف "${name}" قبلاً در رادار ثبت شده است!`);
                nameInput.classList.add('text-red-400');
                setTimeout(() => nameInput.classList.remove('text-red-400'), 1500);
                return;
            }

            greetingsData.push({
                id: Date.now().toString() + Math.random().toString(16).slice(2), // تولید ID کاملاً یکتا
                name: name,
                method: null,
                priority: selectedAddPriority
            });

            nameInput.value = '';
            // پاک کردن جستجو هنگام افزودن فرد جدید تا در لیست دیده شود
            if(searchQuery !== '') {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
            }
            
            saveData();
            renderList();
        }

        function toggleMethod(id, methodType) {
            const index = greetingsData.findIndex(p => p.id === id);
            if (index === -1) return;

            greetingsData[index].method = greetingsData[index].method === methodType ? null : methodType;
            saveData();
            renderList();
        }

        function togglePriority(id) {
            const index = greetingsData.findIndex(p => p.id === id);
            if (index === -1) return;

            let p = greetingsData[index].priority || 2;
            p = (p % 3) + 1; // سیکل بین 1، 2، 3
            greetingsData[index].priority = p;
            
            saveData();
            renderList();
        }

        function setAddPriority(p) {
            selectedAddPriority = p;
            // دکمه‌های انتخاب اولویت در باکس افزودن
            [1, 2, 3].forEach(i => {
                const btn = document.getElementById(`prio-set-${i}`);
                if (i === p) {
                    const colorClass = i === 1 ? 'red-500' : (i === 2 ? 'primary' : 'cyan-400');
                    const borderColor = i === 1 ? 'rgba(239,68,68,0.5)' : (i === 2 ? 'rgba(251,81,251,0.5)' : 'rgba(34,211,238,0.5)');
                    btn.className = `w-8 h-8 rounded-lg bg-${i === 1 ? 'red-500' : (i === 2 ? 'primary' : 'cyan-400')}/20 border border-${i === 1 ? 'red-500' : (i === 2 ? 'primary' : 'cyan-400')}/50 flex items-center justify-center transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]`;
                } else {
                    btn.className = `w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center transition-all hover:bg-white/10`;
                }
            });
        }

        function deletePerson(id) {
            if(confirm('آیا هدف مورد نظر حذف شود؟')) {
                greetingsData = greetingsData.filter(p => p.id !== id);
                saveData();
                renderList();
            }
        }

        function editPerson(id) {
            const index = greetingsData.findIndex(p => p.id === id);
            if (index === -1) return;
            
            const newName = prompt('نام جدید:', greetingsData[index].name);
            if (newName && newName.trim() !== '') {
                const isDuplicate = greetingsData.some((person, idx) => idx !== index && person.name.toLowerCase() === newName.trim().toLowerCase());
                if(isDuplicate) {
                    alert('این نام قبلاً وجود دارد!');
                    return;
                }
                greetingsData[index].name = newName.trim();
                saveData();
                renderList();
            }
        }

        // --- Search Function ---
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            if (searchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderList();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchQuery = '';
            clearSearchBtn.classList.add('hidden');
            searchInput.focus();
            renderList();
        });

        // --- Sort Function ---
        function sortListAlphabetically() {
            if(greetingsData.length === 0) return;
            
            greetingsData.sort((a, b) => {
                return sortAscending 
                    ? a.name.localeCompare(b.name, 'fa') 
                    : b.name.localeCompare(a.name, 'fa');
            });
            
            // برعکس کردن منطق سورت برای دفعه بعد
            sortAscending = !sortAscending;
            
            // تغییر افکت آیکون
            sortIcon.style.transform = sortAscending ? 'scaleY(1)' : 'scaleY(-1)';
            sortBtn.classList.add('bg-green-500/30');
            setTimeout(() => sortBtn.classList.remove('bg-green-500/30'), 500);

            saveData();
            renderList();
        }

        sortBtn.addEventListener('click', sortListAlphabetically);

        function sortListByPriority() {
            if(greetingsData.length === 0) return;
            
            greetingsData.sort((a, b) => {
                const prioA = a.priority || 2;
                const prioB = b.priority || 2;
                if(prioA !== prioB) return prioA - prioB;
                return a.name.localeCompare(b.name, 'fa');
            });
            
            sortPriorityBtn.classList.add('bg-red-500/30');
            setTimeout(() => sortPriorityBtn.classList.remove('bg-red-500/30'), 500);

            saveData();
            renderList();
        }

        sortPriorityBtn.addEventListener('click', sortListByPriority);

        function toggleCompletedVisibility() {
            showCompleted = !showCompleted;
            toggleCompletedIcon.innerText = showCompleted ? 'visibility' : 'visibility_off';
            toggleCompletedBtn.classList.toggle('bg-yellow-500/30', !showCompleted);
            renderList();
        }

        toggleCompletedBtn.addEventListener('click', toggleCompletedVisibility);

        // --- JSON Export / Import Functions ---
        // (همان توابع قبلی بدون تغییر)
        function exportJSON() {
            if (greetingsData.length === 0) { alert("لیست خالی است!"); return; }
            const dataStr = JSON.stringify(greetingsData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "eid_targets_backup.json";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        importBtn.addEventListener('click', () => importFile.click());

        importFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('آیا مطمئن هستید؟ اطلاعات جایگزین خواهند شد.')) {
                            greetingsData = importedData;
                            saveData(); renderList();
                        }
                    } else alert('فرمت فایل نامعتبر است.');
                } catch (error) { alert('خطا در خواندن فایل.'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        });
        exportBtn.addEventListener('click', exportJSON);

        // --- Drag and Drop Functions (اکنون بر اساس ID کار می‌کند) ---
        function dragStart(e) {
            dragStartId = this.getAttribute('data-id');
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => this.classList.add('opacity-0'), 0);
        }

        function dragEnd(e) {
            this.classList.remove('dragging', 'opacity-0');
            document.querySelectorAll('.draggable-item').forEach(item => item.classList.remove('drag-over'));
        }

        function dragOver(e) { e.preventDefault(); }
        function dragEnter(e) { e.preventDefault(); this.classList.add('drag-over'); }
        function dragLeave(e) { this.classList.remove('drag-over'); }

        function drop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const dropId = this.getAttribute('data-id');
            moveItemById(dragStartId, dropId);
        }

        function moveItemById(dragId, dropId) {
            if(dragId === dropId) return;
            
            // پیدا کردن ایندکس‌ها در دیتابیس اصلی (نه لیست فیلتر شده)
            const fromIndex = greetingsData.findIndex(p => p.id === dragId);
            const itemToMove = greetingsData.splice(fromIndex, 1)[0]; // حذف از جای قبلی
            
            const toIndex = greetingsData.findIndex(p => p.id === dropId); // پیدا کردن جای جدید
            greetingsData.splice(toIndex, 0, itemToMove); // درج در جای جدید
            
            saveData();
            renderList();
        }

        // --- Utils ---
        function updateProgress() {
            const total = greetingsData.length;
            const completed = greetingsData.filter(p => p.method !== null).length;
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

            progressBar.style.width = `${percentage}%`;
            
            const toPersian = num => num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
            
            progressText.innerText = `${toPersian(completed)} / ${toPersian(total)}`;

            // بروزرسانی آمار اولویت‌ها
            const stats = { 1: { t: 0, c: 0 }, 2: { t: 0, c: 0 }, 3: { t: 0, c: 0 } };
            greetingsData.forEach(p => {
                const pr = p.priority || 2;
                stats[pr].t++;
                if (p.method !== null) stats[pr].c++;
            });

            [1, 2, 3].forEach(pr => {
                if (prioStatsElems[pr]) {
                    prioStatsElems[pr].innerText = `${toPersian(stats[pr].c)} / ${toPersian(stats[pr].t)}`;
                }
            });
        }

        function getInitials(name) {
            const parts = name.trim().split(' ');
            return parts.length >= 2 ? parts[0][0] + ' ' + parts[1][0] : parts[0].substring(0, 2);
        }

        // --- UI Rendering ---
        function renderList() {
            listContainer.innerHTML = ''; 

            // اعمال فیلتر جستجو و وضعیت تکمیل
            const filteredData = greetingsData.filter(person => {
                const matchesSearch = person.name.toLowerCase().includes(searchQuery);
                const isHidden = !showCompleted && person.method !== null;
                return matchesSearch && !isHidden;
            });

            if (greetingsData.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center p-12 bg-surface-dark/40 backdrop-blur-md rounded-2xl border border-white/5">
                        <span class="material-symbols-outlined text-5xl text-white/20 mb-3 block">radar</span>
                        <p class="text-white/40 font-body">هیچ هدفی در رادار یافت نشد.<br/>یک نام وارد کنید.</p>
                    </div>`;
                return;
            }

            if (filteredData.length === 0 && searchQuery !== '') {
                listContainer.innerHTML = `
                    <div class="text-center p-8 bg-surface-dark/40 backdrop-blur-md rounded-2xl border border-white/5">
                        <span class="material-symbols-outlined text-4xl text-primary/30 mb-2 block">search_off</span>
                        <p class="text-white/40 font-body text-sm">هدفی با این نام پیدا نشد.</p>
                    </div>`;
                return;
            }

            filteredData.forEach((person) => {
                const isDone = person.method !== null;
                const prio = person.priority || 2;
                
                let statusText = 'در انتظار';
                let statusBadge = 'bg-white/5 border-white/10 text-white/50';
                
                let priorityClass = `priority-${prio}`;
                let priorityGlowClass = `priority-${prio}-glow`;
                let priorityText = prio === 1 ? 'فوری' : (prio === 2 ? 'عادی' : 'سر فرصت');
                let priorityIconName = prio === 1 ? 'error' : (prio === 2 ? 'fiber_manual_record' : 'low_priority');
                
                let rowStyle = isDone ? 'opacity-50 border-white/5 bg-surface-dark/40' : `bg-surface-dark/60 ${priorityClass} hover:shadow-[0_0_15px_rgba(251,81,251,0.1)]`;
                let nameStyle = isDone ? 'line-through text-white/30' : 'text-white drop-shadow-md';

                const activeBtnStyle = 'bg-primary/20 text-primary border-primary/50 shadow-[0_0_15px_rgba(251,81,251,0.4)] scale-110';
                const inactiveBtnStyle = 'bg-white/5 border-transparent text-white/40 hover:bg-white/10 hover:text-white hover:border-white/20';

                if (person.method === 'call') {
                    statusText = 'ارتباط صوتی'; statusBadge = 'bg-primary/10 border-primary/30 text-primary drop-shadow-[0_0_5px_rgba(251,81,251,0.5)]';
                } else if (person.method === 'message') {
                    statusText = 'داده ارسال شد'; statusBadge = 'bg-blue-500/10 border-blue-500/30 text-blue-400 drop-shadow-[0_0_5px_rgba(59,130,246,0.5)]';
                } else if (person.method === 'meet') {
                    statusText = 'ملاقات فیزیکی'; statusBadge = 'bg-green-500/10 border-green-500/30 text-green-400 drop-shadow-[0_0_5px_rgba(34,197,94,0.5)]';
                }

                const itemHTML = `
                    <div class="draggable-item group flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-2xl border backdrop-blur-md transition-all duration-300 ${rowStyle} gap-4 cursor-default" 
                         draggable="true" data-id="${person.id}">
                        
                        <div class="flex items-center gap-3 sm:w-1/3">
                            <span class="material-symbols-outlined text-white/10 hover:text-white/50 cursor-grab active:cursor-grabbing px-1 touch-none">drag_indicator</span>
                            
                            <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-white/5 to-white/10 flex items-center justify-center text-white/60 font-display font-bold text-sm border border-white/10">
                                ${isDone ? '<span class="material-symbols-outlined text-primary text-base drop-shadow-[0_0_5px_rgba(251,81,251,0.8)]">fingerprint</span>' : getInitials(person.name)}
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="togglePriority('${person.id}')" title="تغییر اولویت" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/5 transition-colors">
                                    <span class="material-symbols-outlined text-[16px] ${priorityGlowClass}">${priorityIconName}</span>
                                </button>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-display text-lg tracking-wide transition-all ${nameStyle}">${person.name}</h3>
                                    <span class="priority-badge badge-${prio} hidden sm:inline-block">${priorityText}</span>
                                    <span class="text-[9px] font-bold px-2 py-0.5 rounded border inline-block mt-0.5 sm:hidden ${statusBadge}">${statusText}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-center gap-3 bg-black/20 sm:bg-transparent p-2 sm:p-0 rounded-xl border border-white/5 sm:border-none">
                            <button onclick="toggleMethod('${person.id}', 'call')" title="تماس" class="w-10 h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ${person.method === 'call' ? activeBtnStyle : inactiveBtnStyle}">
                                <span class="material-symbols-outlined text-[20px] ${person.method === 'call' ? 'filled-icon' : ''}">settings_phone</span>
                            </button>
                            <button onclick="toggleMethod('${person.id}', 'message')" title="پیام" class="w-10 h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ${person.method === 'message' ? activeBtnStyle : inactiveBtnStyle}">
                                <span class="material-symbols-outlined text-[20px] ${person.method === 'message' ? 'filled-icon' : ''}">chat</span>
                            </button>
                            <button onclick="toggleMethod('${person.id}', 'meet')" title="دیدار" class="w-10 h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ${person.method === 'meet' ? activeBtnStyle : inactiveBtnStyle}">
                                <span class="material-symbols-outlined text-[20px] ${person.method === 'meet' ? 'filled-icon' : ''}">accessibility_new</span>
                            </button>
                        </div>
                        
                        <div class="flex items-center justify-end gap-3 sm:w-1/3">
                            <span class="hidden sm:inline-block px-3 py-1 rounded-md border text-[10px] font-bold font-body transition-all ${statusBadge}">
                                ${statusText}
                            </span>
                            
                            <div class="flex items-center gap-1 border-r border-white/10 pr-3 mr-1 opacity-20 group-hover:opacity-100 transition-opacity">
                                <button onclick="editPerson('${person.id}')" title="ویرایش" class="w-8 h-8 rounded-lg flex items-center justify-center text-white/50 hover:text-blue-400 hover:bg-blue-400/10 transition-all">
                                    <span class="material-symbols-outlined text-[18px]">edit_square</span>
                                </button>
                                <button onclick="deletePerson('${person.id}')" title="حذف" class="w-8 h-8 rounded-lg flex items-center justify-center text-white/50 hover:text-red-400 hover:bg-red-400/10 transition-all">
                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHTML);
            });

            document.querySelectorAll('.draggable-item').forEach(item => {
                item.addEventListener('dragstart', dragStart);
                item.addEventListener('dragend', dragEnd);
                item.addEventListener('dragover', dragOver);
                item.addEventListener('dragenter', dragEnter);
                item.addEventListener('dragleave', dragLeave);
                item.addEventListener('drop', drop);
            });
        }

        // --- Event Listeners ---
        addBtn.addEventListener('click', addPerson);
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPerson();
        });

        renderList();
        updateProgress();
    </script>
</body>
</html>
